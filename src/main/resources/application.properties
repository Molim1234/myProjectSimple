spring.application.name=demo

spring.datasource.url=jdbc:postgresql://localhost:5433/incident_db
spring.datasource.username=incident_user
spring.datasource.password=change_me
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

spring.flyway.enabled=false

# Local-development defaults only. Override both values with environment variables
# before deploying the application outside your local machine.
app.security.jwt-secret=${JWT_SECRET:local-development-jwt-secret-change-this-before-deploying-123456}
app.security.bootstrap-secret=${APP_BOOTSTRAP_SECRET:local-bootstrap-secret-change-this}
app.security.access-token-minutes=15
app.security.refresh-token-days=7

logging.level.org.springframework.security=INFO
